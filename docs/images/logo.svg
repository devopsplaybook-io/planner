<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background rounded rectangle -->
  <rect x="2.5" y="2.5" width="95" height="95" rx="18" fill="#015887" stroke="#014c75" stroke-width="5"/>

  <!-- Kanban board (two columns) -->
  <!-- Column 1 background -->
  <rect x="16" y="16" width="31" height="68" rx="6" fill="#ffffff" opacity="0.95"/>
  <!-- Column 2 background -->
  <rect x="53" y="16" width="31" height="68" rx="6" fill="#ffffff" opacity="0.95"/>

  <!-- Column header dots -->
  <circle cx="27" cy="27" r="2.5" fill="#015887" opacity="0.35"/>
  <circle cx="64" cy="27" r="2.5" fill="#015887" opacity="0.35"/>

  <!-- Card 1 (column 1) -->
  <rect x="20" y="36" width="23" height="14" rx="3" fill="#e8f4fd"/>
  <rect x="24" y="40" width="10" height="2.5" rx="1.25" fill="#015887" opacity="0.25"/>
  <path d="M35 44.5 L36.5 46 L39 43" fill="none" stroke="#4caf50" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Card 2 (column 1) -->
  <rect x="20" y="54" width="23" height="14" rx="3" fill="#f0f4f8"/>
  <rect x="24" y="58" width="12" height="2.5" rx="1.25" fill="#015887" opacity="0.25"/>
  <circle cx="35" cy="63" r="2" fill="#ff9800"/>

  <!-- Card 3 (column 2) -->
  <rect x="57" y="36" width="23" height="14" rx="3" fill="#f0f4f8"/>
  <rect x="61" y="40" width="10" height="2.5" rx="1.25" fill="#015887" opacity="0.25"/>
  <circle cx="72" cy="44.5" r="2" fill="#bdbdbd"/>

  <!-- Card 4 (column 2) -->
  <rect x="57" y="54" width="23" height="14" rx="3" fill="#f0f4f8"/>
  <rect x="61" y="58" width="12" height="2.5" rx="1.25" fill="#015887" opacity="0.25"/>
  <circle cx="72" cy="63" r="2" fill="#bdbdbd"/>
</svg>