apiVersion: apps/v1
kind: Deployment
metadata:
  name: planner
  labels:
    app: planner
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: planner
  template:
    metadata:
      labels:
        app: planner
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        # fsGroup only covers volumes that support ownership management, and it
        # never repairs existing files on a hostPath or local-path volume: a
        # /data created by an image that ran as root (before 0.95.0) keeps
        # root-owned files. The server refuses to start when it cannot write to
        # DATA_DIR, so hand the volume to the runtime user first.
        - name: data-volume-ownership
          image: busybox
          command: ["sh", "-c", "chown -R 1000:1000 /data"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - mountPath: /data
              name: pod-volume
      containers:
        - image: planner
          name: planner
          imagePullPolicy: Always
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          env:
            # Required: the server refuses to start without a strong JWT_KEY
            - name: JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: planner-secrets
                  key: jwtKey
            # Server timezone (IANA name): drives the task template schedules,
            # the dated instance titles, the due-date day boundaries and the
            # notification fallback (default UTC)
            - name: TZ
              value: Europe/Paris
          readinessProbe:
            httpGet:
              path: /api/status
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            limits:
              memory: 500Mi
              cpu: 1
            requests:
              memory: 20Mi
              cpu: 100m
          volumeMounts:
            - mountPath: /data
              name: pod-volume
            - name: config-volume
              mountPath: /opt/app/planner/config.json
              subPath: config.json
      volumes:
        - name: pod-volume
          persistentVolumeClaim:
            claimName: planner
        - name: config-volume
          configMap:
            name: planner-config
