apiVersion: apps/v1
kind: Deployment
metadata:
  name: planner
  labels:
    app: planner
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: planner
  template:
    metadata:
      labels:
        app: planner
    spec:
      containers:
        - image: planner
          name: planner
          imagePullPolicy: Always
          readinessProbe:
            httpGet:
              path: /api/status
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            limits:
              memory: 500Mi
              cpu: 1
            requests:
              memory: 20Mi
              cpu: 100m
          volumeMounts:
            - mountPath: /data
              name: pod-volume
            - name: config-volume
              mountPath: /opt/app/planner/config.json
              subPath: config.json
      volumes:
        - name: pod-volume
          persistentVolumeClaim:
            claimName: planner
        - name: config-volume
          configMap:
            name: planner-config
